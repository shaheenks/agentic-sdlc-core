[project]
name = "sdlc-core-mcp"
version = "0.1.0"
description = "Core MCP server of the Entra stack: sdlc_mcp with the Entra token verifier and identity adapter"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastmcp>=4.0",
    "sdlc-auth[server]",
    "sdlc-config",
    "sdlc-mcp",
]

[project.scripts]
sdlc-core-mcp = "sdlc_core_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sdlc_core_mcp"]
