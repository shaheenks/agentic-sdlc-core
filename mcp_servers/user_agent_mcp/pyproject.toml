[project]
name = "sdlc-user-agent-mcp"
version = "0.1.0"
description = "The MCP server for calls made as a user (DEC-0002)."
requires-python = ">=3.12"
dependencies = [
    "sdlc-service",
    "sdlc-logging",
    "sdlc-config-store",
    "sdlc-identity",
    "sdlc-directory",
    "sdlc-policy",
    "mcp>=2.2,<3",
    "cryptography>=45",
    "httpx>=0.28",
    "sdlc-connectors",
    "sdlc-control",
    "pyyaml>=6",
]

[project.scripts]
sdlc-user-agent-mcp = "user_agent_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/user_agent_mcp"]
