[project]
name = "sdlc-event-agent-mcp"
version = "0.0.0"
description = "The MCP server for scheduled and event-triggered runs, as the system identity (DEC-0007)."
requires-python = ">=3.12"
dependencies = ["sdlc-service"]

[project.scripts]
sdlc-event-agent-mcp = "event_agent_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/event_agent_mcp"]
