[project]
name = "sdlc-knowledge-search"
version = "0.0.0"
description = "Knowledge search over the JSONL knowledge store, filtered by the caller's data scope."
requires-python = ">=3.12"
dependencies = ["sdlc-service"]

[project.scripts]
sdlc-knowledge-search = "knowledge_search.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_search"]
