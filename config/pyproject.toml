[project]
name = "sdlc-config"
version = "0.0.0"
description = "The platform's declared access model and the tool that validates and publishes it."
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0.2"]

[project.scripts]
sdlc-config = "sdlc_config.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sdlc_config"]
