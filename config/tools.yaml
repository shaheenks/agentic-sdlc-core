apiVersion: sdlc/v1
kind: ToolCatalog
# A tool registered in code but absent here is never exposed. `args` lists the arguments that
# team policies may constrain (policy.tools.constraints); the server checks they exist in code.
servers:
  core-mcp: { description: "Core MCP server (mcp_servers/core_mcp)" }
tools:
  ping:              { server: core-mcp, risk: low }
  whoami:            { server: core-mcp, risk: low }
  list_skills:       { server: core-mcp, risk: low }
  load_skill:        { server: core-mcp, risk: low }
  get_agent_context: { server: core-mcp, risk: low }
  resolve_team:      { server: core-mcp, risk: low }    # version-03 P10 G9: the caller's own teams only
  search_knowledge:  { server: core-mcp, risk: low,    data_scoped: true }
  graph_query:       { server: core-mcp, risk: low,    data_scoped: true }
  config_info:       { server: core-mcp, risk: high }    # admin only (via roles.admin "*")
  config_explain:    { server: core-mcp, risk: high }    # admin only; input: group aliases / app roles
  # version-01 M6: read-only tools that call an external system AS THE USER, with the user's own
  # connection (connections.yaml). The provider's own permissions apply on top of this policy.
  jira_get_issue:      { server: core-mcp, risk: low, credentials: { user: atlassian } }
  confluence_get_page: { server: core-mcp, risk: low, credentials: { user: atlassian } }
  github_get_file:     { server: core-mcp, risk: low, credentials: { user: github },    args: { repo: { type: string } } }
  bitbucket_get_file:  { server: core-mcp, risk: low, credentials: { user: bitbucket }, args: { repo: { type: string } } }
  # version-03 P5: documents the agent saves for the caller (owner only; content never in audit)
  save_artifact:       { server: core-mcp, risk: low }
  list_artifacts:      { server: core-mcp, risk: low }
  read_artifact:       { server: core-mcp, risk: low }
  delete_artifact:     { server: core-mcp, risk: low }
