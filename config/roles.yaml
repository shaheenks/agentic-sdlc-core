apiVersion: sdlc/v1
kind: RoleSet
# Global bindings apply regardless of team. Identify principals by group alias (groups.yaml)
# or by Entra app role value (`app_role: SDLC.Admin`), for tenants that use app roles.
bindings:
  - group: eng-all
    roles: [viewer]
  - group: platform-admins
    roles: [admin]
roles:
  viewer:
    tools:  { allow: [ping, whoami, list_skills, load_skill, get_agent_context, search_knowledge] }
    skills: { allow: ["tag:general"] }
    data:   { max_classification: internal }
  developer:
    inherits: [viewer]
    tools:  { allow: [graph_query, generate_tests, review_code] }
    skills: { allow: ["tag:engineering"] }
  lead:
    inherits: [developer]
    tools:  { allow: [approve_design] }
    data:   { max_classification: confidential }
  admin:
    inherits: [lead]
    # unconstrained: team argument limits (e.g. allowed repos) don't apply to this role's grants
    tools:  { allow: ["*"], unconstrained: true }
    skills: { allow: ["*"] }
    data:   { max_classification: restricted, sources: ["*"] }
