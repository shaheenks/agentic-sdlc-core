# Surfaces that call user_agent_mcp for a user (FR-AUTHZ-006), and the tool groups each may use. Who may act as
# each surface is declared per environment in env/<env>/identity.yaml: the service accounts under `callers`
# (modes caller_token and trusted_header) or the OAuth clients under `clients` (mode oauth, off for now).
surfaces:
  sdlc_ui:
    description: The platform's web UI and its backend; the only place connection secrets are entered.
    tool_groups: [identity, artifacts, connections, connection_secrets, knowledge, jira, repositories, control]
  user_agent:
    description: The interactive agent on the agent runtime, in sessions sdlc_ui starts for the user.
    tool_groups: [identity, artifacts, connections, knowledge, jira, repositories, control]
  gemini_enterprise:
    description: >-
      The Gemini Enterprise app, through the A2A router and user_agent. Needs identity mode oauth, so it is not
      reachable for now (DEC-0010).
    tool_groups: [identity, artifacts, connections, knowledge, jira, repositories, control]
  event_agents:
    description: >-
      The event agents' deployment (ci_workflow_agent, operations_agent) acting as the system identity through
      event_agent_mcp (DEC-0007, DEC-0015); its grants come from env/<env>/system.yaml only.
    system: true
    tool_groups: [knowledge, repositories, ci_read, ci_write, code_workspace]
