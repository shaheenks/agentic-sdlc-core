# Connection providers (FR-CONN-001, FR-CONN-003): GitHub, Bitbucket, Jira and Confluence in both editions.
# Confluence connections can be saved now; its tools come after phase 4a. A Data Center connection names its server's base URL when the user saves it.
providers:
  github:
    name: GitHub
    system: github
    edition: cloud
    base_url: https://api.github.com
  github_enterprise:
    name: GitHub Enterprise Server
    system: github
    edition: data_center
  bitbucket_cloud:
    name: Bitbucket Cloud
    system: bitbucket
    edition: cloud
    base_url: https://api.bitbucket.org
  bitbucket_dc:
    name: Bitbucket Data Center
    system: bitbucket
    edition: data_center
  jira_cloud:
    name: Jira Cloud
    system: jira
    edition: cloud
  jira_dc:
    name: Jira Data Center
    system: jira
    edition: data_center
  confluence_cloud:
    name: Confluence Cloud
    system: confluence
    edition: cloud
  confluence_dc:
    name: Confluence Data Center
    system: confluence
    edition: data_center
