apiVersion: sdlc/v1
kind: Platform
identity:
  provider: entra
  tenant_id: "${ENTRA_TENANT_ID}"
  # Cloud endpoints (E7): commercial cloud below; sovereign clouds use their own hosts, e.g.
  # https://login.microsoftonline.us + https://graph.microsoft.us (GCC High). issuer and jwks_uri
  # must use authority_host. The agent web app and oauth2-proxy take ENTRA_AUTHORITY_HOST instead.
  authority_host: "https://login.microsoftonline.com"
  graph_host: "https://graph.microsoft.com"
  issuer: "https://login.microsoftonline.com/${ENTRA_TENANT_ID}/v2.0"
  jwks_uri: "https://login.microsoftonline.com/${ENTRA_TENANT_ID}/discovery/v2.0/keys"
  # Entra v2 access tokens carry the API app's client ID as `aud`; v1 tokens carry the App ID URI.
  audience: ["${ENTRA_API_CLIENT_ID}", "api://${ENTRA_API_CLIENT_ID}"]
  required_scopes: [access_as_user]     # delegated (user) tokens only; app-only tokens have no scp
  groups:
    claim: groups
    overage_fallback: graph_transitive_member_of
    cache_ttl_seconds: 600
classification_levels: [public, internal, confidential, restricted]   # ascending
knowledge:
  # One embedding model for the whole index: mixing models in one vector index breaks search.
  # Changing it requires re-ingesting every source. The DB column is vector(<dimensions>).
  embedding: { model: gemini-embedding-2, dimensions: 768 }
  # Knowledge-graph extraction (Stage 6): one structured-output LLM call per new chunk of a source
  # with spec.ingest.graph.enabled (results cached by chunk content). Sources may narrow the
  # relation types; entity types are always set per source.
  graph:
    model: gemini-3.8-flash
    thinking_level: low        # optional; "low" is ~4x faster than the default with equal quality here
    relation_types: [depends_on, calls, uses, runs_on, stores_data_in, owns, part_of,
                     implements, documents, alerts, caused_by, mitigated_by, affects]
  # PDF pages without a text layer (scans), for sources with spec.ingest.pdf.ocr: gemini (H10).
  # One call per text-less page, cached by page content.
  ocr:
    model: gemini-3.8-flash
    thinking_level: low
defaults:
  deny_by_default: true
  max_classification: public
  # Per-user tool calls per minute (all tools) unless the user's teams set their own
  # (teams/<team>.yaml policy/limits). Counted per MCP server instance.
  rate_limit: { calls_per_minute: 120 }
