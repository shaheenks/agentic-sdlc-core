# A Bitbucket Data Center repository as a knowledge source (FR-KNOW-001); the file name (ledger-docs) is its ID.
# Data Center clone URLs have the form https://<host>/scm/<project>/<repo>.git. As for Bitbucket Cloud, only
# repositories readable without a credential can be ingested yet. `ref` may be a branch, tag or full commit SHA.
name: Ledger docs
description: Ledger architecture decisions and runbooks.
kind: git
location: https://bitbucket.example.com/scm/led/ledger-docs.git
ref: release/2026.11
include: ["docs/**/*.md", "adr/**/*.md"]
link: https://bitbucket.example.com/projects/LED/repos/ledger-docs/browse/{path}?at={ref}
classification: internal
extract: false
