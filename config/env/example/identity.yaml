# Identity settings of one environment. Copy env/example/ to env/<env>/ (git-ignored) and fill in real values.

# How user_agent_mcp learns who the user is (DEC-0010):
# - caller_token: a service account under `callers` forwards the user in X-SDLC-User-Id and X-SDLC-User-Email
#   and proves itself with its Google ID token (audience: the server's PUBLIC_URL).
# - trusted_header: the same headers without proof, plus X-SDLC-Surface; only in the local environment.
# - oauth: the user's own Google token, issued to a client under `clients` (off for now).
mode: caller_token

# Only users with an email in these Cloud Identity domains are accepted.
allowed_domains: [example.test]

# Per surface, the service accounts (email or unique ID) that may call as a user.
callers:
  sdlc_ui: [sdlc-ui@example-project.iam.gserviceaccount.com]
  user_agent: [user-agent@example-project.iam.gserviceaccount.com]