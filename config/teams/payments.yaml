apiVersion: sdlc/v1
kind: Team
metadata:
  name: payments
  description: Payment APIs and UI (payments-api, payments-ui); card data under PCI DSS.
  owners: [payments-leads]           # group aliases; also drive CODEOWNERS
membership:
  - group: payments-devs
    roles: [developer]
  - group: payments-leads
    roles: [lead]
  - app_role: SDLC.Payments.Developer   # app roles: no group overage (version-03 P2 E1)
    roles: [developer]
  - app_role: SDLC.Payments.Lead
    roles: [lead]
policy:
  tools:
    deny: []                         # team-level denies (deny always wins)
    constraints:
      review_code:
        args:
          repo: { in: [payments-api, payments-ui] }
      generate_tests:
        args:
          repo: { in: [payments-api, payments-ui] }
      approve_design:
        args:
          repo: { in: [payments-api, payments-ui] }
  limits:                            # per user; the most generous of a user's teams applies
    tools:
      graph_query: { calls_per_minute: 30 }   # each call embeds + walks the graph
addons:                              # visible only to members of this team
  skills:
    pci-checklist:        { path: skills/teams/payments/pci-checklist }
    ledger-design-review: { path: skills/teams/payments/ledger-design-review, access: { roles: [lead] } }
    # typed team skills (version-03 P10 G6): tags from platform.yaml skills/team_tags, team members only
    payments-pci-lens:        { path: skills/teams/payments/payments-pci-lens,        tags: [goldfish-lens] }
    payments-story-questions: { path: skills/teams/payments/payments-story-questions, tags: [brief-questions] }
    payments-design-template: { path: skills/teams/payments/payments-design-template, tags: [doc-template] }
  # document flow defaults (version-03 P10 G7), once payments is locked for a document (G9)
  flows:
    document:
      types:
        design:
          template: payments-design-template
          lenses: [lens-design-critic, lens-implementation-readiness, lens-zoom-out]
          required_lenses: [payments-pci-lens]
        user-story:
          brief: payments-story-questions
          lenses: [lens-comprehension, lens-implementation-readiness]
  instructions: skills/teams/payments/AGENT_ADDENDUM.md
  context:
    default_project: payments
    glossary_source: payments-code
