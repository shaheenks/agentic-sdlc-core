apiVersion: sdlc/v1
kind: Source
metadata:
  id: eng-standards
  owner_team: sdlc-platform
  description: engineering standards shared by all teams
spec:
  type: gcs
  location: gs://sdlc-config-store-a7484d8b/source_docs/eng-standards/   # config store bucket (one-time move from samples/, version-02 N14)
  include: ["**/*.md", "**/*.pdf"]
  classification: public
  ingest:
    chunking: { strategy: markdown, max_tokens: 400, overlap: 0 }
    graph:
      enabled: true
      entity_types: [standard, process, service, team, metric]
access:
  everyone: true                 # every signed-in user
  roles: [admin]
