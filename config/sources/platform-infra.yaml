apiVersion: sdlc/v1
kind: Source
metadata:
  id: platform-infra
  owner_team: platform
  description: platform infrastructure, CI docs and runbooks
spec:
  type: local_folder
  location: samples/sources/platform-infra
  include: ["**/*.md", "**/*.tf", "**/*.pdf"]
  classification: internal
  ingest:
    chunking: { strategy: auto, max_tokens: 400, overlap: 40 }
    pdf: { ocr: gemini }               # scanned notices: text-less pages are read by the model (H10)
    graph:
      enabled: true
      entity_types: [service, component, data_store, environment, runbook, metric, team, alert]
access:
  teams: [platform]
  roles: [admin]
