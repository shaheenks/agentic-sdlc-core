apiVersion: sdlc/v1
kind: Source
metadata:
  id: payments-code
  owner_team: payments
  description: payments-api service code and docs
spec:
  type: local_folder
  location: samples/sources/payments-api      # relative to the repo root
  include: ["**/*.py", "**/*.md"]
  exclude: ["**/tests/fixtures/**"]
  classification: internal
  ingest:
    chunking: { strategy: auto, max_tokens: 400, overlap: 40 }
    graph:
      enabled: true
      entity_types: [service, component, api, data_store, team, alert, process]
    schedule: manual
access:                              # the ONLY place that grants read access to this data
  teams: [payments]
  roles: [admin]
