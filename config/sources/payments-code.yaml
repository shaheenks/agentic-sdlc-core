apiVersion: sdlc/v1
kind: Source
metadata:
  id: payments-code
  owner_team: payments
  description: payments-api service code and docs
spec:
  type: gcs
  location: gs://sdlc-config-store-a7484d8b/source_docs/payments-code/   # config store bucket (one-time move from samples/, version-02 N14)
  include: ["**/*.py", "**/*.md"]
  exclude: ["**/tests/fixtures/**"]
  classification: internal
  ingest:
    chunking: { strategy: auto, max_tokens: 400, overlap: 40 }
    graph:
      enabled: true
      entity_types: [service, component, api, data_store, team, alert, process]
    schedule: manual
access:                              # the ONLY place that grants read access to this data
  teams: [payments]
  roles: [admin]
