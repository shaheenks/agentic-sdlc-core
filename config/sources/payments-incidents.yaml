apiVersion: sdlc/v1
kind: Source
metadata:
  id: payments-incidents
  owner_team: payments
  description: payments incident postmortems (confidential)
spec:
  type: gcs
  location: gs://sdlc-config-store-a7484d8b/source_docs/payments-incidents/   # config store bucket (one-time move from samples/, version-02 N14)
  include: ["**/*.md"]
  classification: confidential        # readable only by roles cleared for confidential (lead, admin)
  ingest:
    chunking: { strategy: markdown, max_tokens: 400, overlap: 0 }
    graph:
      enabled: true
      entity_types: [incident, service, component, data_store, team, alert, process]
      relation_types: [caused_by, mitigated_by, affects, owns, depends_on, runs_on, alerts]
access:
  teams: [payments]
  roles: [admin]
