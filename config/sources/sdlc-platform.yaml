apiVersion: sdlc/v1
kind: Source
metadata:
  id: sdlc-platform
  owner_team: sdlc-platform
  description: agentic-sdlc platform code, config and design docs (GitHub agentic-sdlc-core, main)
spec:
  type: git
  location: https://github.com/shaheenks/agentic-sdlc-core.git
  provider: github
  ref: main                            # tracked: resolved on every ingest run (public repo, no credentials)
  include: ["**/*.py", "**/*.md", "**/*.yaml", "**/*.yml", "**/*.tf", "**/*.sql", "**/*.ps1", "**/Dockerfile", "**/*.toml"]
  exclude: ["samples/**", "tests/**", "**/*.lock", "**/*.example"]
  classification: internal
  ingest:
    chunking: { strategy: auto, max_tokens: 400, overlap: 40 }
    graph:
      enabled: true
      entity_types: [service, component, library, tool, config_kind, role, stage, document]
      relation_types: [depends_on, calls, uses, runs_on, stores_data_in, owns, part_of, implements, documents]
access:
  teams: [sdlc-platform]
  roles: [admin]
