# Grants (FR-AUTHZ-007): each gives tool groups to everyone, to teams (`payments`, or one role:
# `payments:lead`) or to user groups. A tool group no grant names is available to no one.
grants:
  - id: everyone-basics
    description: Every user's own identity, artifacts and connections.
    tool_groups: [identity, artifacts, connections, connection_secrets]
    to: {everyone: true}
