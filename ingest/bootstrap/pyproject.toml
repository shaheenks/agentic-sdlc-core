[project]
name = "sdlc-ingest"
version = "0.1.0"
description = "Bootstrap ingest: config-driven sources -> chunks -> embeddings -> Postgres (RLS)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pypdf>=6",
    "sdlc-config",
    "sdlc-db",
]

[project.scripts]
sdlc-ingest = "sdlc_ingest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sdlc_ingest"]
