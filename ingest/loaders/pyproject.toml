[project]
name = "sdlc-loaders"
version = "0.1.0"
description = "Source loaders for ingest: local folders, git, and (version-01) remote sources"
requires-python = ">=3.12,<3.14"
dependencies = [
    "httpx>=0.28",
    "sdlc-config",
    "sdlc-secrets",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sdlc_loaders"]
