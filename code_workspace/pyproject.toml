[project]
name = "sdlc-code-workspace"
version = "0.1.0"
description = "Cloud Run job where ci_workflow_agent's changes are built, tested and pushed (DEC-0015)."
requires-python = ">=3.12"
dependencies = ["sdlc-logging", "sdlc-connectors"]

[project.scripts]
sdlc-code-workspace = "code_workspace.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/code_workspace"]
