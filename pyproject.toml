[project]
name = "agentic-sdlc-v2"
version = "0.0.0"
description = "Specification for a platform that runs pre-defined agentic SDLC workflows for users and teams."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.6",
    "pyyaml>=6.0.4",
]

[tool.uv]
package = false
default-groups = ["docs"]
