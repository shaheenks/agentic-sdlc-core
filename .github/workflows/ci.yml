# CI: lint, the specification bundle and docs site, tests per component, sdlc_ui, images and Terraform.
# No secrets and no cloud access.
name: ci

on:
  push:
    branches: [main-v2]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_PYTHON_DOWNLOADS: automatic

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-packages --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run python tools/okf_bundle.py lint
      - run: uv run mkdocs build --strict

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component:
          - mcp_servers/user_agent_mcp
          - mcp_servers/event_agent_mcp
          - a2a_router
          - knowledge_search
          - event_gateway
          - knowledge_ingest
          - code_workspace
          - interactive_agents/user_agent
          - event_based_agents/ci_workflow_agent
          - event_based_agents/operations_agent
          - libs/sdlc_logging
          - libs/sdlc_service
          - libs/sdlc_config_store
          - libs/sdlc_identity
          - libs/sdlc_directory
          - libs/sdlc_policy
          - libs/sdlc_knowledge
          - config
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-packages --frozen
      - name: Tests of ${{ matrix.component }}, from its own folder
        working-directory: ${{ matrix.component }}
        run: uv run pytest

  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the permission diff compares with the base revision
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-packages --frozen
      # Real environments are git-ignored; the example environment checks the shared files and the schemas.
      - run: uv run sdlc-config validate --env example
      # Who gains or loses which tools (FR-CFG-002), in the job summary for the reviewer. Informational: a base
      # in a shape this compiler predates is reported, not a failure.
      - name: Permission diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "No base revision to compare with." >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          {
            echo '```'
            uv run sdlc-config diff --env example --base "git:$BASE" 2>&1 || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdlc_ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sdlc_ui/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component:
          - mcp_servers/user_agent_mcp
          - mcp_servers/event_agent_mcp
          - a2a_router
          - knowledge_search
          - event_gateway
          - knowledge_ingest
          - code_workspace
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f ${{ matrix.component }}/Dockerfile .

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/gcp
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
