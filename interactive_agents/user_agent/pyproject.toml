[project]
name = "sdlc-user-agent"
version = "0.0.0"
description = "The interactive agent (knowledge search, brainstorming, features, design)."
requires-python = ">=3.12"
dependencies = ["sdlc-logging"]

[project.scripts]
sdlc-user-agent = "user_agent.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/user_agent"]
