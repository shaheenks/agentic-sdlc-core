[project]
name = "sdlc-knowledge-ingest"
version = "0.0.0"
description = "Ingests declared sources into JSONL files; runs in the build pipeline."
requires-python = ">=3.12"
dependencies = ["sdlc-logging"]

[project.scripts]
sdlc-knowledge-ingest = "knowledge_ingest.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_ingest"]
