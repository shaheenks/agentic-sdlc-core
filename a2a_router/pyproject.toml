[project]
name = "sdlc-a2a-router"
version = "0.0.0"
description = "The A2A entry point to user_agent for Gemini Enterprise and later third-party surfaces."
requires-python = ">=3.12"
dependencies = ["sdlc-service"]

[project.scripts]
sdlc-a2a-router = "a2a_router.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/a2a_router"]
