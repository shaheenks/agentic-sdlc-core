[project]
name = "sdlc-operations-agent"
version = "0.0.0"
description = "The event-based agent for deployments, alerts, incidents and bugs."
requires-python = ">=3.12"
dependencies = ["sdlc-logging"]

[project.scripts]
sdlc-operations-agent = "operations_agent.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/operations_agent"]
