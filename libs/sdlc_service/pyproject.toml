[project]
name = "sdlc-service"
version = "0.0.0"
description = "HTTP service basics shared by the platform's services."
requires-python = ">=3.12"
dependencies = ["sdlc-logging", "starlette>=0.47", "uvicorn>=0.35"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sdlc_service"]
