[project]
name = "sdlc-policy"
version = "0.1.0"
description = "Authorization decisions for MCP tools from an EffectivePolicy (deny by default)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "sdlc-config",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sdlc_policy"]
