[project]
name = "sdlc-policy"
version = "0.0.0"
description = "The Access Policy: effective permissions from declared grants, decided deny by default, and rate limits."
requires-python = ">=3.12"
dependencies = ["sdlc-directory"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sdlc_policy"]
