[project]
name = "sdlc-directory"
version = "0.0.0"
description = "A user's teams, team roles and user groups, from the Google groups mapped in configuration."
requires-python = ">=3.12"
dependencies = ["httpx>=0.28", "google-auth>=2.40"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sdlc_directory"]
