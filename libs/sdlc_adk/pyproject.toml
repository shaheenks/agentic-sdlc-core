[project]
name = "sdlc-adk"
version = "0.0.0"
description = "What the platform's ADK agents share: ID tokens for MCP servers, Gemini with retries, skills, direct MCP calls."
requires-python = ">=3.12"
dependencies = ["httpx>=0.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sdlc_adk"]
