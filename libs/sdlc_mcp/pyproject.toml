[project]
name = "sdlc-mcp"
version = "0.1.0"
description = "The SDLC MCP server body (tools, policy middleware, audit, artifacts, connections) behind an identity adapter; used by the MCP server components"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastmcp>=4.0",
    "opentelemetry-exporter-gcp-trace>=1.9",  # Cloud Trace on GCP (SDLC_TRACE_TO_CLOUD, N4)
    "opentelemetry-exporter-otlp-proto-http>=1.42.1",
    "opentelemetry-instrumentation-psycopg>=0.63b1",
    "pyyaml>=6.0",
    "sdlc-artifacts",
    "sdlc-auth",
    "sdlc-config",
    "sdlc-connectors",
    "sdlc-db",
    "sdlc-policy",
]

[project.scripts]
sdlc-reconcile-connections = "sdlc_mcp.reconcile_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sdlc_mcp"]
