[project]
name = "sdlc-knowledge"
version = "0.0.0"
description = "The knowledge store's JSONL records, and the embedders that ingest and search share (DEC-0011)."
requires-python = ">=3.12"
dependencies = ["google-genai>=1.20"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sdlc_knowledge"]
