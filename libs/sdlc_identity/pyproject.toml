[project]
name = "sdlc-identity"
version = "0.0.0"
description = "Verifies Google account tokens and turns them into a platform identity (DEC-0001, DEC-0009)."
requires-python = ">=3.12"
dependencies = ["httpx>=0.28", "pyjwt[crypto]>=2.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sdlc_identity"]
