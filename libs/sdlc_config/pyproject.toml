[project]
name = "sdlc-config"
version = "0.1.0"
description = "Config loader, validation, ConfigStore and CLI for the agentic SDLC platform"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.23",
    "watchfiles>=1.0",
]

[project.scripts]
sdlc-config = "sdlc_config.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sdlc_config"]
