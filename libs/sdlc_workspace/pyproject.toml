[project]
name = "sdlc-workspace"
version = "0.0.0"
description = "Starting the Code Workspace job and reading its result, for both MCP servers (DEC-0015, DEC-0016)."
requires-python = ">=3.12"
dependencies = ["httpx>=0.28", "google-auth>=2.40"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sdlc_workspace"]
