[project]
name = "sdlc-config-store"
version = "0.0.0"
description = "Versioned configuration bundles, the active-version pointer, and the store services read them from."
requires-python = ">=3.12"
dependencies = ["google-cloud-storage>=3.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sdlc_config_store"]
