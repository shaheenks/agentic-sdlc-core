[project]
name = "sdlc-web"
version = "0.1.0"
description = "Serves ADK agents (adk web) behind oauth2-proxy with Entra user binding and token passthrough"
requires-python = ">=3.12,<3.14"
dependencies = [
    "ag-ui-adk>=0.11.0",
    "a2a-sdk[http-server]>=0.3.4,<0.4",  # A2A 0.3 (JSON-RPC), version-03 P4 C3
    "google-adk[mcp,a2a]>=2.10",
    "google-cloud-aiplatform>=1.148.1,<2",  # Agent Engine sessions on GCP; same range as google-adk[gcp]
    "opentelemetry-exporter-gcp-trace>=1.9",  # Cloud Trace on GCP (SDLC_TRACE_TO_CLOUD, N4)
    "opentelemetry-exporter-otlp-proto-http>=1.42.1",
    "sdlc-agent",  # A2UI cards leave A2A as DataParts (a2a.py)
    "sdlc-auth[server]",
    "uvicorn>=0.30",
]

[project.scripts]
sdlc-agent-web = "sdlc_web.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sdlc_web"]
