[project]
name = "sdlc-control"
version = "0.0.0"
description = "A team's sdlc-control repository: feature branches, artifact approvals and the record of writes (DEC-0012, DEC-0013, DEC-0015)."
requires-python = ">=3.12"
dependencies = ["sdlc-connectors", "pyyaml>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sdlc_control"]
