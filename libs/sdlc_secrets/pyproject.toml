[project]
name = "sdlc-secrets"
version = "0.1.0"
description = "Secret references resolved at runtime: env (local, CI) or Google Secret Manager, with a short cache"
requires-python = ">=3.12,<3.14"
dependencies = [
    "httpx>=0.28",
    "google-auth>=2.0",
    "requests>=2.0",  # google.auth.transport.requests refreshes ADC / service-identity tokens
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sdlc_secrets"]
