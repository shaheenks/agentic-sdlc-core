[project]
name = "sdlc-connectors"
version = "0.1.0"
description = "External systems: HTTP with host allowlist, Atlassian format converters, per-user connections"
requires-python = ">=3.12,<3.14"
dependencies = [
    "cryptography>=42",  # local encrypted user-secret store (dev)
    "httpx>=0.28",
    "sdlc-config",
    "sdlc-secrets",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sdlc_connectors"]
