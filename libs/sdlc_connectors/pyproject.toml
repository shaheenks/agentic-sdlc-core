[project]
name = "sdlc-connectors"
version = "0.0.0"
description = "Adapters for Jira, GitHub and Bitbucket, cloud and Data Center editions (Connectors component)."
requires-python = ">=3.12"
dependencies = ["httpx>=0.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sdlc_connectors"]
