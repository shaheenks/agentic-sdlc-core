[project]
name = "sdlc-artifacts"
version = "0.1.0"
description = "Content store for agent-generated artifacts (local folder or GCS) and their limits"
requires-python = ">=3.12,<3.14"
dependencies = [
    "httpx>=0.28",
    "sdlc-secrets",  # adc_token_provider for the GCS backend
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sdlc_artifacts"]
