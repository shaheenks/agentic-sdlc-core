[project]
name = "sdlc-auth"
version = "0.1.0"
description = "Entra ID identity for the agentic SDLC platform: token validation, Principal, group resolution"
requires-python = ">=3.12,<3.14"
dependencies = [
    "httpx>=0.28",
]

[project.optional-dependencies]
# Token verification for MCP servers (fastmcp JWTVerifier). Agents do not need this.
server = ["fastmcp>=4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sdlc_auth"]
