[project]
name = "sdlc-event-gateway"
version = "0.0.0"
description = "Receives, verifies, deduplicates and triages events, and starts unattended runs."
requires-python = ">=3.12"
dependencies = ["sdlc-service"]

[project.scripts]
sdlc-event-gateway = "event_gateway.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/event_gateway"]
