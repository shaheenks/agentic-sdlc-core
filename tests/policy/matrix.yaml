# Persona matrix: every row is checked in CI (tests/policy/test_matrix.py).
# A new tool needs rows here (CLAUDE.md: tools.yaml entry + grants + persona-matrix rows).
# expect: allow | deny.  `args` are the call arguments.
rows:
  # identity basics: every signed-in user
  - { persona: nobody,        tool: whoami,          expect: allow }
  - { persona: nobody,        tool: list_skills,     expect: deny }
  - { persona: viewer,        tool: list_skills,     expect: allow }
  - { persona: viewer,        tool: load_skill,      expect: allow }
  - { persona: viewer,        tool: review_code,     args: { repo: payments-api },   expect: deny }
  # payments developer: payments repos only, no approvals, no admin tools
  - { persona: payments-dev,  tool: review_code,     args: { repo: payments-api },   expect: allow }
  - { persona: payments-dev,  tool: review_code,     args: { repo: payments-ui },    expect: allow }
  - { persona: payments-dev,  tool: review_code,     args: { repo: platform-infra }, expect: deny }
  - { persona: payments-dev,  tool: review_code,     args: {},                       expect: deny }
  - { persona: payments-dev,  tool: generate_tests,  args: { repo: payments-api },   expect: allow }
  - { persona: payments-dev,  tool: approve_design,  args: { repo: payments-api },   expect: deny }
  - { persona: payments-dev,  tool: config_info,     expect: deny }
  # payments lead: approvals within payments
  - { persona: payments-lead, tool: approve_design,  args: { repo: payments-api },   expect: allow }
  - { persona: payments-lead, tool: approve_design,  args: { repo: platform-ci },    expect: deny }
  # platform developer: platform repos only
  - { persona: platform-dev,  tool: review_code,     args: { repo: agentic-sdlc-core }, expect: allow }
  - { persona: platform-dev,  tool: review_code,     args: { repo: payments-api },   expect: deny }
  - { persona: platform-dev,  tool: generate_tests,  args: { repo: agentic-sdlc-core }, expect: allow }
  - { persona: platform-dev,  tool: generate_tests,  args: { repo: platform-ci },    expect: deny }   # old repo name
  # member of two teams: union of repos
  - { persona: multi-team-dev, tool: review_code,    args: { repo: payments-api },   expect: allow }
  - { persona: multi-team-dev, tool: review_code,    args: { repo: agentic-sdlc-core }, expect: allow }
  - { persona: multi-team-dev, tool: review_code,    args: { repo: secret-repo },    expect: deny }
  # admin: whole catalog, unconstrained
  - { persona: admin,         tool: config_info,     expect: allow }
  - { persona: admin,         tool: config_explain,  expect: allow }
  - { persona: admin,         tool: review_code,     args: { repo: any-repo },       expect: allow }
  - { persona: admin,         tool: approve_design,  args: { repo: platform-ci },    expect: allow }
  # catalog tools implemented in later stages (rows keep their grants under test)
  - { persona: nobody,        tool: ping,              expect: allow }
  - { persona: viewer,        tool: get_agent_context, expect: allow }
  # artifacts (version-03 P5): viewer and up, owner only (ownership is enforced by RLS, not here)
  - { persona: nobody,        tool: save_artifact,     expect: deny }
  - { persona: nobody,        tool: list_artifacts,    expect: deny }
  - { persona: nobody,        tool: read_artifact,     expect: deny }
  - { persona: nobody,        tool: delete_artifact,   expect: deny }
  - { persona: viewer,        tool: save_artifact,     expect: allow }
  - { persona: viewer,        tool: list_artifacts,    expect: allow }
  - { persona: viewer,        tool: read_artifact,     expect: allow }
  - { persona: viewer,        tool: delete_artifact,   expect: allow }
  - { persona: payments-dev,  tool: save_artifact,     expect: allow }
  - { persona: admin,         tool: read_artifact,     expect: allow }
  - { persona: direct-viewer, tool: save_artifact,     expect: allow }
  - { persona: nobody,        tool: get_agent_context, expect: deny }
  # version-03 P10 G9: which of the caller's own teams a document is for (viewer and up)
  - { persona: nobody,        tool: resolve_team,      expect: deny }
  - { persona: viewer,        tool: resolve_team,      expect: allow }
  - { persona: multi-team-dev, tool: resolve_team,     expect: allow }
  - { persona: pending-user,  tool: resolve_team,      expect: deny }
  - { persona: viewer,        tool: search_knowledge,  expect: allow }
  - { persona: viewer,        tool: graph_query,       expect: allow }   # data limited to granted sources
  - { persona: payments-dev,  tool: graph_query,       expect: allow }
  - { persona: platform-dev,  tool: graph_query,       expect: allow }
  - { persona: nobody,        tool: graph_query,       expect: deny }
  - { persona: admin,         tool: graph_query,       expect: allow }
  - { persona: infra-reader,  tool: graph_query,       expect: allow }
  - { persona: infra-reader,  tool: generate_tests,    args: { repo: platform-infra }, expect: deny }  # source group grants data, not developer tools
  # version-01 M6: tools that use the user's own connection (developers and above)
  - { persona: viewer,        tool: jira_get_issue,      expect: deny }
  - { persona: payments-dev,  tool: jira_get_issue,      expect: allow }
  - { persona: nobody,        tool: confluence_get_page, expect: deny }
  - { persona: platform-dev,  tool: confluence_get_page, expect: allow }
  - { persona: viewer,        tool: github_get_file,     args: { repo: acme/pay }, expect: deny }
  - { persona: payments-dev,  tool: github_get_file,     args: { repo: acme/pay }, expect: allow }
  - { persona: admin,         tool: github_get_file,     args: { repo: any/repo }, expect: allow }
  - { persona: viewer,        tool: bitbucket_get_file,  args: { repo: ws/pay },   expect: deny }
  - { persona: platform-dev,  tool: bitbucket_get_file,  args: { repo: ws/infra }, expect: allow }

  # version-02 N10: direct members from users.yaml (no Entra groups)
  - { persona: direct-payments-dev, tool: review_code,  args: { repo: payments-api },   expect: allow }
  - { persona: direct-payments-dev, tool: review_code,  args: { repo: platform-infra }, expect: deny }
  - { persona: direct-payments-dev, tool: graph_query,  expect: allow }
  - { persona: direct-payments-dev, tool: approve_design, args: { repo: payments-api }, expect: deny }
  - { persona: direct-viewer,       tool: search_knowledge, expect: allow }
  - { persona: direct-viewer,       tool: review_code,  args: { repo: payments-api },   expect: deny }
  - { persona: pending-user,        tool: graph_query,  expect: deny }
  - { persona: pending-user,        tool: review_code,  args: { repo: platform-infra }, expect: deny }

# Skill visibility (Stage 4). expect: visible | hidden. Every skill needs rows.
skill_rows:
  - { persona: nobody,         skill: write-user-story,     expect: hidden }
  - { persona: viewer,         skill: write-user-story,     expect: visible }
  - { persona: viewer,         skill: test-case-gen,        expect: hidden }
  - { persona: payments-dev,   skill: test-case-gen,        expect: visible }
  - { persona: payments-dev,   skill: pci-checklist,        expect: visible }
  - { persona: payments-dev,   skill: ledger-design-review, expect: hidden }   # leads only
  - { persona: payments-dev,   skill: design-review,        expect: hidden }   # leads only
  - { persona: payments-dev,   skill: infra-change-review,  expect: hidden }   # platform add-on
  - { persona: payments-lead,  skill: ledger-design-review, expect: visible }
  - { persona: payments-lead,  skill: design-review,        expect: visible }
  - { persona: platform-dev,   skill: infra-change-review,  expect: visible }
  - { persona: platform-dev,   skill: pci-checklist,        expect: hidden }   # payments add-on
  - { persona: multi-team-dev, skill: pci-checklist,        expect: visible }
  - { persona: multi-team-dev, skill: infra-change-review,  expect: visible }
  - { persona: admin,          skill: ledger-design-review, expect: visible }  # "*" covers add-ons
  - { persona: admin,          skill: infra-change-review,  expect: visible }
  - { persona: direct-payments-dev, skill: pci-checklist,        expect: visible }
  - { persona: direct-payments-dev, skill: ledger-design-review, expect: hidden }
  - { persona: pending-user,        skill: infra-change-review,  expect: hidden }
  # Goldfish document flow (version-03 P10): viewers and up; no groups = nothing
  - { persona: nobody,         skill: egm-document-flow,             expect: hidden }
  - { persona: nobody,         skill: lens-zoom-out,                 expect: hidden }
  - { persona: viewer,         skill: egm-document-flow,             expect: visible }
  - { persona: viewer,         skill: lens-zoom-out,                 expect: visible }
  - { persona: viewer,         skill: lens-comprehension,            expect: visible }
  - { persona: viewer,         skill: lens-design-critic,            expect: visible }
  - { persona: viewer,         skill: lens-implementation-readiness, expect: visible }
  - { persona: payments-dev,   skill: lens-design-critic,            expect: visible }
  - { persona: pending-user,   skill: lens-zoom-out,                 expect: hidden }
  # G4 brainstorm + G5 opt-in lenses: same grants as the flow and the other lenses
  - { persona: nobody,         skill: egm-brainstorm,                expect: hidden }
  - { persona: nobody,         skill: lens-structure,                expect: hidden }
  - { persona: viewer,         skill: egm-brainstorm,                expect: visible }
  - { persona: viewer,         skill: lens-structure,                expect: visible }
  - { persona: viewer,         skill: lens-style,                    expect: visible }
  - { persona: pending-user,   skill: egm-brainstorm,                expect: hidden }
  - { persona: pending-user,   skill: lens-style,                    expect: hidden }
  # G6 typed team skills: payments members only; the viewer's tag:goldfish-lens does not reach them
  - { persona: viewer,         skill: payments-pci-lens,        expect: hidden }
  - { persona: payments-dev,   skill: payments-pci-lens,        expect: visible }
  - { persona: payments-dev,   skill: payments-story-questions, expect: visible }
  - { persona: payments-dev,   skill: payments-design-template, expect: visible }
  - { persona: payments-lead,  skill: payments-pci-lens,        expect: visible }
  - { persona: platform-dev,   skill: payments-pci-lens,        expect: hidden }
  - { persona: platform-dev,   skill: payments-design-template, expect: hidden }
  - { persona: multi-team-dev, skill: payments-pci-lens,        expect: visible }
  - { persona: admin,          skill: payments-pci-lens,        expect: visible }  # "*"
  - { persona: nobody,         skill: payments-story-questions, expect: hidden }

# Data access (Stage 5). readable = source granted by Source.access AND its classification is at
# or below the persona's ceiling (both are enforced by Postgres RLS). Every source needs rows.
data_rows:
  - { persona: nobody,        source: eng-standards,      expect: readable }    # everyone + public (no search tool though)
  - { persona: viewer,        source: eng-standards,      expect: readable }
  - { persona: viewer,        source: payments-code,      expect: unreadable }
  - { persona: payments-dev,  source: payments-code,      expect: readable }
  - { persona: payments-dev,  source: payments-incidents, expect: unreadable }  # confidential > internal
  - { persona: payments-dev,  source: platform-infra,     expect: unreadable }
  - { persona: payments-lead, source: payments-incidents, expect: readable }
  - { persona: platform-dev,  source: platform-infra,     expect: readable }
  - { persona: platform-dev,  source: payments-code,      expect: unreadable }
  - { persona: admin,         source: payments-incidents, expect: readable }
  - { persona: admin,         source: platform-infra,     expect: readable }
  - { persona: platform-dev,  source: sdlc-platform,      expect: readable }
  - { persona: payments-dev,  source: sdlc-platform,      expect: unreadable }
  - { persona: viewer,        source: sdlc-platform,      expect: unreadable }
  - { persona: admin,         source: sdlc-platform,      expect: readable }
  # source-level Entra group without team membership (version-02 N9)
  - { persona: infra-reader,  source: platform-infra,     expect: readable }
  - { persona: infra-reader,  source: eng-standards,      expect: readable }
  - { persona: infra-reader,  source: payments-code,      expect: unreadable }
  - { persona: infra-reader,  source: sdlc-platform,      expect: unreadable }
  - { persona: infra-reader,  source: payments-incidents, expect: unreadable }
  # users.yaml direct members (version-02 N10)
  - { persona: direct-payments-dev, source: payments-code,      expect: readable }
  - { persona: direct-payments-dev, source: payments-incidents, expect: unreadable }  # confidential
  - { persona: direct-payments-dev, source: platform-infra,     expect: unreadable }
  - { persona: direct-viewer,       source: eng-standards,      expect: readable }
  - { persona: direct-viewer,       source: payments-code,      expect: unreadable }
  - { persona: pending-user,        source: platform-infra,     expect: unreadable }
