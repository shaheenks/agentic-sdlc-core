# Persona matrix: every row is checked in CI (tests/policy/test_matrix.py).
# A new tool needs rows here (CLAUDE.md: tools.yaml entry + grants + persona-matrix rows).
# expect: allow | deny.  `args` are the call arguments.
rows:
  # identity basics: every signed-in user
  - { persona: nobody,        tool: whoami,          expect: allow }
  - { persona: nobody,        tool: list_skills,     expect: deny }
  - { persona: viewer,        tool: list_skills,     expect: allow }
  - { persona: viewer,        tool: load_skill,      expect: allow }
  - { persona: viewer,        tool: review_code,     args: { repo: payments-api },   expect: deny }
  # payments developer: payments repos only, no approvals, no admin tools
  - { persona: payments-dev,  tool: review_code,     args: { repo: payments-api },   expect: allow }
  - { persona: payments-dev,  tool: review_code,     args: { repo: payments-ui },    expect: allow }
  - { persona: payments-dev,  tool: review_code,     args: { repo: platform-infra }, expect: deny }
  - { persona: payments-dev,  tool: review_code,     args: {},                       expect: deny }
  - { persona: payments-dev,  tool: generate_tests,  args: { repo: payments-api },   expect: allow }
  - { persona: payments-dev,  tool: approve_design,  args: { repo: payments-api },   expect: deny }
  - { persona: payments-dev,  tool: config_info,     expect: deny }
  # payments lead: approvals within payments
  - { persona: payments-lead, tool: approve_design,  args: { repo: payments-api },   expect: allow }
  - { persona: payments-lead, tool: approve_design,  args: { repo: platform-ci },    expect: deny }
  # platform developer: platform repos only
  - { persona: platform-dev,  tool: review_code,     args: { repo: platform-infra }, expect: allow }
  - { persona: platform-dev,  tool: review_code,     args: { repo: payments-api },   expect: deny }
  - { persona: platform-dev,  tool: generate_tests,  args: { repo: platform-ci },    expect: allow }
  # member of two teams: union of repos
  - { persona: multi-team-dev, tool: review_code,    args: { repo: payments-api },   expect: allow }
  - { persona: multi-team-dev, tool: review_code,    args: { repo: platform-ci },    expect: allow }
  - { persona: multi-team-dev, tool: review_code,    args: { repo: secret-repo },    expect: deny }
  # admin: whole catalog, unconstrained
  - { persona: admin,         tool: config_info,     expect: allow }
  - { persona: admin,         tool: config_explain,  expect: allow }
  - { persona: admin,         tool: review_code,     args: { repo: any-repo },       expect: allow }
  - { persona: admin,         tool: approve_design,  args: { repo: platform-ci },    expect: allow }
  # catalog tools implemented in later stages (rows keep their grants under test)
  - { persona: nobody,        tool: ping,              expect: allow }
  - { persona: viewer,        tool: get_agent_context, expect: allow }
  - { persona: nobody,        tool: get_agent_context, expect: deny }
  - { persona: viewer,        tool: search_knowledge,  expect: allow }
  - { persona: viewer,        tool: graph_query,       expect: deny }
  - { persona: payments-dev,  tool: graph_query,       expect: allow }
  - { persona: platform-dev,  tool: graph_query,       expect: allow }
  - { persona: nobody,        tool: graph_query,       expect: deny }
  - { persona: admin,         tool: graph_query,       expect: allow }

# Skill visibility (Stage 4). expect: visible | hidden. Every skill needs rows.
skill_rows:
  - { persona: nobody,         skill: write-user-story,     expect: hidden }
  - { persona: viewer,         skill: write-user-story,     expect: visible }
  - { persona: viewer,         skill: test-case-gen,        expect: hidden }
  - { persona: payments-dev,   skill: test-case-gen,        expect: visible }
  - { persona: payments-dev,   skill: pci-checklist,        expect: visible }
  - { persona: payments-dev,   skill: ledger-design-review, expect: hidden }   # leads only
  - { persona: payments-dev,   skill: design-review,        expect: hidden }   # leads only
  - { persona: payments-dev,   skill: infra-change-review,  expect: hidden }   # platform add-on
  - { persona: payments-lead,  skill: ledger-design-review, expect: visible }
  - { persona: payments-lead,  skill: design-review,        expect: visible }
  - { persona: platform-dev,   skill: infra-change-review,  expect: visible }
  - { persona: platform-dev,   skill: pci-checklist,        expect: hidden }   # payments add-on
  - { persona: multi-team-dev, skill: pci-checklist,        expect: visible }
  - { persona: multi-team-dev, skill: infra-change-review,  expect: visible }
  - { persona: admin,          skill: ledger-design-review, expect: visible }  # "*" covers add-ons
  - { persona: admin,          skill: infra-change-review,  expect: visible }

# Data access (Stage 5). readable = source granted by Source.access AND its classification is at
# or below the persona's ceiling (both are enforced by Postgres RLS). Every source needs rows.
data_rows:
  - { persona: nobody,        source: eng-standards,      expect: unreadable }
  - { persona: viewer,        source: eng-standards,      expect: readable }
  - { persona: viewer,        source: payments-code,      expect: unreadable }
  - { persona: payments-dev,  source: payments-code,      expect: readable }
  - { persona: payments-dev,  source: payments-incidents, expect: unreadable }  # confidential > internal
  - { persona: payments-dev,  source: platform-infra,     expect: unreadable }
  - { persona: payments-lead, source: payments-incidents, expect: readable }
  - { persona: platform-dev,  source: platform-infra,     expect: readable }
  - { persona: platform-dev,  source: payments-code,      expect: unreadable }
  - { persona: admin,         source: payments-incidents, expect: readable }
  - { persona: admin,         source: platform-infra,     expect: readable }
