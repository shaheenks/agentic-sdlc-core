# Personas for the persona-matrix tests and `sdlc-config explain --persona / diff`.
# A persona is a set of group aliases (config/env/<env>/groups.yaml) and/or Entra app roles.
personas:
  nobody:        { groups: [] }
  viewer:        { groups: [eng-all] }
  payments-dev:  { groups: [eng-all, payments-devs] }
  payments-lead: { groups: [eng-all, payments-leads] }
  platform-dev:  { groups: [eng-all, platform-devs] }
  multi-team-dev: { groups: [eng-all, payments-devs, platform-devs] }
  admin:         { groups: [eng-all, platform-admins] }
  infra-reader:  { groups: [eng-all, infra-readers] }    # a source's own group, no team
  # users.yaml direct members (no groups at all); test users from tests/support/config.py
  direct-payments-dev: { groups: [], user: direct-dev }
  direct-viewer:       { groups: [], user: direct-viewer }
  pending-user:        { groups: [], user: pending }       # no oid yet: no access
  # Entra app roles only (version-03 P2 E1): no groups at all, e.g. after group overage.
  # test_app_role_personas_match_group_personas pins each to its group twin.
  approle-viewer:        { groups: [], app_roles: [SDLC.User] }
  approle-payments-dev:  { groups: [], app_roles: [SDLC.User, SDLC.Payments.Developer] }
  approle-payments-lead: { groups: [], app_roles: [SDLC.User, SDLC.Payments.Lead] }
  approle-platform-dev:  { groups: [], app_roles: [SDLC.User, SDLC.Platform.Developer] }
  approle-admin:         { groups: [], app_roles: [SDLC.User, SDLC.Admin] }
  # webapp team: app roles + users.yaml only, no group (so no group twin)
  approle-webapp-dev:    { groups: [], app_roles: [SDLC.User, SDLC.Webapp.Developer] }
  approle-webapp-lead:   { groups: [], app_roles: [SDLC.User, SDLC.Webapp.Lead] }
  approle-team-only:     { groups: [], app_roles: [SDLC.Payments.Developer] }   # team role, no SDLC.User
  # groups and app roles together: the union of both
  mixed-dev:             { groups: [eng-all, payments-devs], app_roles: [SDLC.Platform.Developer] }
  unknown-app-role:      { groups: [], app_roles: [SDLC.NotDefined] }          # grants nothing
