# Personas for the persona-matrix tests and `sdlc-config explain --persona / diff`.
# A persona is a set of Entra app roles and/or a users.yaml user (CH-0011: no Entra groups).
personas:
  nobody:            { app_roles: [] }
  viewer:            { app_roles: [SDLC.User] }
  payments-member:   { app_roles: [SDLC.User, SDLC.Payments.Member] }
  payments-approver: { app_roles: [SDLC.User, SDLC.Payments.Approver] }
  platform-member:   { app_roles: [SDLC.User, SDLC.Platform.Member] }
  multi-team-member: { app_roles: [SDLC.User, SDLC.Payments.Member, SDLC.Platform.Member] }
  admin:             { app_roles: [SDLC.User, SDLC.Admin] }
  infra-reader:      { app_roles: [SDLC.User, SDLC.Infra.Reader] }   # a source's own audience, no team
  webapp-member:     { app_roles: [SDLC.User, SDLC.Webapp.Member] }
  webapp-approver:   { app_roles: [SDLC.User, SDLC.Webapp.Approver] }
  team-only:         { app_roles: [SDLC.Payments.Member] }   # team role, no SDLC.User
  # approver in webapp, member in payments: team roles count only in their own team (CH-0009)
  cross-team-approver: { app_roles: [SDLC.User, SDLC.Webapp.Approver, SDLC.Payments.Member] }
  unknown-app-role:  { app_roles: [SDLC.NotDefined] }          # grants nothing
  # users.yaml direct members (no app roles at all); test users from tests/support/config.py
  direct-payments-member: { user: direct-dev }
  direct-viewer:          { user: direct-viewer }
  pending-user:           { user: pending }       # no oid yet: no access
